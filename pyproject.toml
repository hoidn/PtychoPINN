[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ptychopinn"
description = "PtychoPINN is an unsupervised physics-informed neural network reconstruction method for scanning CDI"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
dependencies = [
    "Pillow",
    "PyYAML",
    "dill",
    "hydra-core>=1.3.2,<2",
    "imageio", 
    "ipywidgets",
    "jupyter",
    "matplotlib",
    "mlflow",
    "neuraloperator",
    "numba",
    "numpy",
    "opencv-python",
    "pandas",
    "pandas-datareader",
    "pathos",
    "pydantic>=2.12,<3",
    "lightning",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "tensorflow>=2.13.0",
    "tensorflow-datasets",
    "tensorflow-hub",
    "tensorflow-metadata",
    "tensorflow-probability",
    "tensordict",
    "tomli; python_version < '3.11'",
    "torch>=2.2",
    "tqdm",
    "ujson",
]
dynamic = ["version"]

 

[project.scripts]
ptycho_train = "scripts.training.train:main"
ptycho_inference = "scripts.inference.inference:main"
ptycho_synthetic = "scripts.simulation.synthetic_pipeline:main"
ptycho_study = "ptycho.workflows.study_runner:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = [
    "frc",
    "ptycho",
    "ptycho.*",
    "ptycho_torch",
    "ptycho_torch.*",
    "scripts.training",
    "scripts.inference",
    "scripts.simulation",
    "scripts.migrate_legacy_bundle",
]
exclude = [
    "ptycho.trash",
    "ptycho.trash.*",
    "ptycho_torch.beta_modules",
    "ptycho_torch.beta_modules.*",
    "ptycho_torch.configs",
    "ptycho_torch.configs.*",
    "ptycho_torch.notebooks",
    "ptycho_torch.notebooks.*",
]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
# Add markers for optional dependencies
markers = [
    "torch: marks tests as requiring PyTorch (deselect with '-m \"not torch\"')",
    "optional: marks tests as requiring optional dependencies",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "mvp: marks tests covering MVP (minimum viable product) field requirements",
    "study: marks tests for study infrastructure (STUDY-SYNTH-FLY64-DOSE-OVERLAP-001)",
    "mini: marks tests as minimal/fast unit tests",
    "integration: marks end-to-end integration smoke tests (project-level alias)",
    "tf_integration: marks TensorFlow end-to-end workflow integration smoke test"
]
# Configure test collection to handle import errors gracefully
addopts = [
    "--strict-markers",
    "--strict-config",
    "--ignore-glob=**/test_*_backup.py",
    "--ignore-glob=**/*.ipynb",  # Ignore Jupyter notebooks
    "-ra"  # show extra test summary info for all except passed
]
# Configure warnings
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Don't show warnings for PyTorch import failures
    "ignore:PyTorch not available.*:UserWarning"
]
