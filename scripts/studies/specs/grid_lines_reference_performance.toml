# Grid-lines reference-performance qualification (plan Task 20).
#
# Executable definition of the reference condition:
#   tests/torch/test_grid_lines_hybrid_resnet_integration.py
# Contract:
#   docs/superpowers/specs/2026-07-09-ci-model-compatibility-ablation-design.md
#   ("Performance-reference clarification 2026-07-11" and the corrected gate
#   text). SSIM floors are the primary gate; fixture MAE tolerances remain a
#   supporting guard; internal historical/generic equality is diagnostic and
#   must be classified when it differs.
#
# The reference dataset is generated procedurally, so its immutable identity
# is this recipe (pinned Run1084 probe archive/array hashes, deterministic
# pad-then-smooth transform hash, and the closed simulation geometry).
# Materialized train/test NPZs are content-fingerprinted at execution time
# and recorded in the sealed evidence.

[schema]
kind = "grid_lines_reference_performance_v1"
version = 1

[study]
id = "grid_lines_reference_performance"

[dataset]
id = "grid_lines_run1084_n128_gs1"
generator = "grid_lines_workflow_v1"
probe_archive = "datasets/Run1084_recon3_postPC_shrunk_3.npz"
probe_archive_sha256 = "9f82cb9eb2c5a853764b98c1657b778600c0e90425296a7d1fdc6e8fdb53c906"
raw_probe_array_sha256 = "de564a3ed5e70118fde70d8b65214ddfb3f00364228ef8b7c61a3f31a56c309a"
transformed_probe_sha256 = "eeccb1c92eae6dce36f4102bccda3f814b3eaa16e03e5c805f786edc628d4cd2"
probe_scale_mode = "pad_extrapolate"
probe_smoothing_sigma = 0.5
set_phi = true
N = 128
gridsize = 1
size = 392
offset = 4
outer_offset_train = 8
outer_offset_test = 20
nimgs_train = 2
nimgs_test = 1
nphotons = 1e9

# ---------------------------------------------------------------------------
# Hybrid ResNet reference: fixture-sourced Task 27 qualification floors.
# Source evidence (visual review approved):
# .artifacts/reference_qualification/task27_gain16_hybrid_prequalification_run2/grid_lines_hybrid_resnet_reference/reference_evidence.json
# SHA-256: 17a323102950d64ad4a3712486f155205a7806b15c6c1e782c69ce84b3b21962
# Floors use the unchanged fixture tolerance policy around measured MAE
# 0.08168590068817139/0.12818376669684495 and SSIM
# 0.8858652644013688/0.9618665959387648.
# Operands are the verbatim integration-test command; unlisted runner fields
# keep the TorchRunnerConfig defaults the integration command relies on.
# (--torch-logger mlflow in the test is a logging backend, not a declared
# experimental condition; the driver records with csv.)
# ---------------------------------------------------------------------------

[[references]]
id = "grid_lines_hybrid_resnet_reference"

[references.runner]
architecture = "hybrid_resnet"
N = 128
gridsize = 1
epochs = 5
batch_size = 16
infer_batch_size = 16
learning_rate = 2e-4
scheduler = "ReduceLROnPlateau"
plateau_factor = 0.5
plateau_patience = 2
plateau_min_lr = 1e-4
