generic_position_crop_border = 59
generic_effective_patch_n = 10
crop_boundaries_equivalent = true
architecture = "hybrid_resnet"
generator_output_mode = "real_imag"
hybrid_encoder_conv_hidden_scale = 2.0
training_patch_weighting = "central_mask"
physics_forward_mode = "amplitude"
amplitude_physics_gain = 16.0
torch_loss_mode = "mae"
seed = 3
epochs = 5
# Fixture floors: exact integration-fixture values (metrics minus tolerances);
# SSIM floors are primary, MAE maxima are the supporting guard.
fixture_amp_mae_max = 0.09668590068817139
fixture_phase_mae_max = 0.15318376669684494
fixture_amp_ssim_min = 0.8508652644013688
fixture_phase_ssim_min = 0.9468665959387648

# The historical grid-tiling stitch and the generic position stitch share the
# declared crop boundary (border 59, effective patch 10) but are not
# bit-identical evaluators. The gated metrics are computed on the historical
# canvas, so this internal difference cannot inflate the SSIM gate.
[references.expected_differences.canvas_equivalence]
classification = "harmless"
justification = "Historical grid-tiling and generic position stitches share the declared crop boundary; hash equality between the two evaluators is diagnostic provenance, and the gated SSIM/MAE are computed on the historical canvas only."

[references.expected_differences.mask_equivalence]
classification = "harmless"
justification = "The valid-coverage masks of the two stitching evaluators may differ at seam boundaries; the fixture metric method scores the historical canvas at the full ground-truth frame."

