# Rung 1a/1b — the ORIGINAL rung 1 (generic loader/schema) bundled three
# effective variables and FAILED its gate; the controller adopted the
# reviewer's pre-split (2026-07-11). Parent lineage: the executed parent
# measurement remains valid evidence at
# .artifacts/bridge_ladder/seed3/rung1_generic_loader/rung_evidence.json
# (sha256 de2f13e796891a6123ab68535fcbf732748534ff131146af7e2c2f82dbfa7fa6,
# amp SSIM 0.4247 / retained 0.4727 vs rung 0). The split chain runs in a
# fresh output root (.artifacts/bridge_ladder/seed3_split/).
#
# Rung 1a — generic loader/schema at FULL scan-set parity: dictionary
# cached-NPZ ingestion -> the generic mmap loader over the schema twin, with
# the bounds filter off and unit legacy scaling inherited from the baseline.
# This is the canonical dictionary-parity bridge for simulator-owned normalized
# amplitudes. Probe stays pass-through (probe_normalize=false); the sealed
# effective-probe hash proves it.
[[rungs]]
id = "rung1a_mmap_full_scanset"
group = "loader_schema"
dataset = "n128_run1084_generic"
requires_normalization_evidence = true
[rungs.changes]
loader = "mmap"
dataset = "n128_run1084_generic"
[rungs.expected_differences.canvas_equivalence]
classification = "harmless"
justification = "Historical grid-tiling and generic position stitches share the declared crop boundary; hash equality between the two evaluators is diagnostic provenance, and the gated SSIM is computed on the declared evaluator's canvas only."
[rungs.expected_differences.mask_equivalence]
classification = "harmless"
justification = "The valid-coverage masks of the two stitching evaluators may differ at seam boundaries; the fixture metric method scores the gated canvas at the full ground-truth frame."

# Rung 1b — ingestion bounds filter alone: the endpoint's (0.1, 0.9) scan
