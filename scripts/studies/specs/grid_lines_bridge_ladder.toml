[baseline.config]
dataset = "n128_run1084_dictionary"
loader = "dictionary"
gated_evaluator = "historical"
probe_normalize = false
# Generic-loader scan bounds filter: "off" is the dictionary path's effective
# behavior (no position filtering). The endpoint's (0.1, 0.9) filter enters
# at rung 1b (rung-1 split adopted 2026-07-11).
mmap_bounds_filter = "off"
# Which scale convention a generic loader resolves: simulator-owned normalized
# amplitudes use "dictionary_parity" (DataConfig normalize='None', unit legacy
# scalars). This field is inert under the dictionary loader, so rung0 behavior
# remains unchanged while canonical rung1a inherits the parity convention.
mmap_scale_convention = "dictionary_parity"
# Train-sampler regime of the generic loader. "sequential" names CURRENT
# mmap behavior (V3b: TensorDictDataLoader's default SequentialSampler —
# fixed raster order, every batch 16 spatially adjacent positions).
# Inert under the dictionary loader (its train loader shuffles natively);
# the historical 1d/1e diagnostics stepped it, while the canonical chain keeps
# sequential after those controls exonerated sampler policy.
mmap_train_sampler = "sequential"
# Probe batch layout of both current loaders. Task 25 migrated dictionary
# emission to the documented (B, C, P, H, W) contract. The old flat-rank
# mechanism belongs only to sealed historical rung1f evidence and is not a
# runnable rung in this spec.
