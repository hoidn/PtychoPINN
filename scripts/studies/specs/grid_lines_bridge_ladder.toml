[[residuals]]
id = "object_family_scan_pattern"
description = "The endpoint's lines arms use the Task 15 canonical-lines materialization (5000 nongrid positions, N=640 objects); the ladder stays on the grid-scan grid_lines_workflow data whose object generator Task 15 proved morphology-equivalent. Scan-pattern/geometry effects are Task 23 corrected-matrix bridge-continuity subjects."

[[residuals]]
id = "dose"
description = "Ladder count twins realize the recipe's nphotons=1e9 budget; the endpoint datasets are calibrated to ~3.5e6 photons/image. Dose is not a study parameter (design revision 2026-07-10)."

[[residuals]]
id = "epoch_budget"
description = "The ladder holds the reference 5-epoch budget; the endpoint trained 20 epochs. Convergence/budget selection is design gate 4 (Task 22)."

[[residuals]]
id = "architecture_width"
description = "The ladder holds hybrid_encoder_conv_hidden_scale=2.0 (reference); the endpoint declared 1.0 plus gradient clipping 1.0. Width/config parity is a Task 22 hypothesis."

[[residuals]]
id = "driver_inference_reassembly"
description = "The endpoint driver reconstructs via reassembly.reconstruct_image_barycentric with probe patch weighting and middle_trim=32; the ladder's generic evaluator is the runner position stitch. Driver-evaluator continuity is re-established in Task 23 via the reference bridge."
