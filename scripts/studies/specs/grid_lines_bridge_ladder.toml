rect_s1s2_trainable = false
varpro_scaling = false
architecture = "hybrid_resnet"
seed = 3
epochs = 5
batch_size = 16
infer_batch_size = 16
learning_rate = 2e-4
hybrid_encoder_conv_hidden_scale = 2.0
scheduler = "ReduceLROnPlateau"
plateau_factor = 0.5
plateau_patience = 2
plateau_min_lr = 1e-4
plateau_threshold = 0.0
optimizer = "adam"
weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.999
generator_output_mode = "real_imag"
probe_source = "custom"
fno_modes = 12
fno_width = 32
fno_blocks = 4
fno_cnn_blocks = 2
enable_checkpointing = true
logger_backend = "csv"

# ---------------------------------------------------------------------------
