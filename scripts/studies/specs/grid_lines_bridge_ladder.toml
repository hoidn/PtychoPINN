# One-variable configuration bridge ladder (plan Task 21).
#
# Rung 0 is the fresh Task 28 gain-16 qualified grid-lines Hybrid ResNet
# reference. Task 20 run1 evidence is retained below only as superseded
# historical provenance and cannot adjudicate under bridge v4/evidence v3.
# Each rung
# changes exactly ONE configuration group on the path toward the withdrawn
# study endpoint (N=64/C=4/mmap/count/Poisson/rectangular/VarPro); the first
# rung that materially loses retained SSIM identifies the regression source.
# Contract: docs/superpowers/specs/2026-07-09-ci-model-compatibility-ablation-design.md
# gate 3 ("One-variable ladder") and plan Task 21.
#
# Ladder invariants (never changed by any rung; deliberately NOT walked):
#   architecture=hybrid_resnet, seed=3 (CLI --seed adds more seeds without
#   spec changes), epochs=5, batch sizes, learning rate/scheduler/optimizer,
#   hybrid conv hidden scale 2.0. Epoch budget and width parity are gate-4 /
#   Task 22 subjects; the remaining reference-to-endpoint differences are
#   declared under [[residuals]].
#
# Pre-split notes (single-group hygiene):
# - The reference bridge records that the mmap loader normalizes the probe
#   while the dictionary loader passes it through (mmap_same_config_equivalent
#   = false). To keep rung 1 a pure loader/schema step, the ladder declares
#   probe_normalize=false (the dictionary path's EFFECTIVE behavior) from the
#   baseline on, and turns normalization on only in the probe rung (rung 3).
#   The per-rung effective-probe hash is sealed evidence; an unexpected
#   difference fails closed as an unclassified difference.
# - The domain rung (rung 6) carries the count re-expression of the SAME data
#   (aligned count twin: scripts/studies/make_aligned_count_twin.py inverts
#   the recorded normalization at the recipe's nphotons) plus the Poisson
#   loss and the amplitude-physics count bridge (count_scale_mode=auto). The
#   (version, domain) scale-contract PAIR is declared at rung 6 because the
#   runtime (scaling_contract.resolve_scale_contract) validates it as an
#   inseparable pair — only legacy_v1+normalized_amplitude and
#   ci_intensity_v2+count_intensity exist. CI ACTIVATION still happens at
#   rung 7 through the physics switch (ci_scaling_active gates on
#   rectangular_scaled), preserving the design rule that CI scaling is
#   active only for rectangular Poisson NLL.
# - position_crop_border tracks the scan-pitch-derived effective patch
#   (N - 2*border = 10 at offset 4), so the N rung moves it 59 -> 27; it is a
#   derived quantity of the detector_size group, not an independent variable.

[schema]
kind = "grid_lines_bridge_ladder_v1"
version = 1

[study]
id = "grid_lines_bridge_ladder"

# ---------------------------------------------------------------------------
# Task 28 convergence gate: every mmap rung is compared with the dictionary
# baseline. PASS requires baseline-relative absolute amplitude SSIM delta <=
# 0.02 and absolute phase SSIM delta <= 0.01, with locked provenance and no
# protocol failure. Historical retained-SSIM evidence remains schema-readable.
# ---------------------------------------------------------------------------
[gate]
policy = "absolute_ssim_delta_v1"
threshold_provenance = "locked"
max_abs_amp_ssim_delta = 0.02
max_abs_phase_ssim_delta = 0.01

# ---------------------------------------------------------------------------
