[[gates]]
id = "deadleaves_ci_seed_success"
target = { object_family = "deadleaves", architecture = "hybrid_resnet", physics_profile = "ci_nll" }
operator = "status_count_ge"
status = "success"
threshold = 3
requested = 3

[[gates]]
id = "deadleaves_ci_truth_amp_pearson"
target = { object_family = "deadleaves", architecture = "hybrid_resnet", physics_profile = "ci_nll" }
operator = "ge"
metric = "truth_quality.amp_pearson"
aggregation = "median"
threshold = 0.5
min_successful = 2
requires = ["has_object_truth"]
when_dataset_kind = "synthetic"

