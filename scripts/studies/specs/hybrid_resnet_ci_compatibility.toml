[schema]
version = 1

[study]
id = "hybrid-resnet-ci-compatibility"
seeds = [3, 17, 29]
output_root = ".artifacts/ci_compatibility/full_v3"
require_all_explicit = true

[base.overrides]
"dataset.id" = "deadleaves_ci_3p5m"
"data.N" = 64
"data.C" = 4
"data.n_subsample" = 1
"data.grid_size" = [2, 2]
"data.probe_scale" = 4.0
"data.probe_normalize" = true
"data.x_bounds" = [0.1, 0.9]
"data.y_bounds" = [0.1, 0.9]
